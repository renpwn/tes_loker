<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Transaksi - PPOB PDAM</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212 !important;
            color: #e0e0e0 !important;
        }
        .card {
            background-color: #1e1e1e !important;
            border: 1px solid #2d2d2d !important;
        }
        .table {
            color: #e0e0e0 !important;
        }
        .table thead th {
            color: #0dcaf0 !important;
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card shadow-lg">
                    <div class="card-header bg-dark border-bottom border-secondary text-white d-flex justify-content-between align-items-center py-3">
                        <h4 class="mb-0 fw-bold">Riwayat Transaksi Pembayaran PDAM</h4>
                        <a href="index.html" class="btn btn-outline-light btn-sm">Kembali ke Beranda</a>
                    </div>
                    <div class="card-body p-4">
                        <div class="table-responsive">
                            <table class="table table-dark table-striped table-bordered border-secondary align-middle">
                                <thead class="border border-info bg-transparent">
                                    <tr>
                                        <th>Waktu</th>
                                        <th>PDAM</th>
                                        <th>ID Pelanggan</th>
                                        <th>Nama</th>
                                        <th>Total Bayar</th>
                                        <th>Status</th>
                                        <th>Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="historyTableBody">
                                    <tr>
                                        <td colspan="7" class="text-center text-secondary">Memuat data riwayat...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allTransactions = [];

        async function fetchHistory() {
            try {
                const response = await fetch('/api/history');
                allTransactions = await response.json();
                const tbody = document.getElementById('historyTableBody');

                if (allTransactions.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center text-secondary">Belum ada riwayat transaksi.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                allTransactions.forEach((tx) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><small class="text-secondary">${tx.created_at}</small></td>
                        <td><strong>${tx.nama_pdam}</strong></td>
                        <td>${tx.idpel}</td>
                        <td>${tx.nama}</td>
                        <td class="fw-bold text-warning">Rp ${tx.total_bayar.toLocaleString('id-ID')}</td>
                        <td><span class="badge border border-success text-success bg-transparent">${tx.status}</span></td>
                        <td>
                            <a href="struk.html?id=${tx.id}" target="_blank" class="btn btn-outline-info btn-sm fw-semibold">Lihat Struk</a>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                document.getElementById('historyTableBody').innerHTML = `<tr><td colspan="7" class="text-center text-danger">Gagal memuat data riwayat.</td></tr>`;
            }
        }

        fetchHistory();
    </script>
</body>
</html>
